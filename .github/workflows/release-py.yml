# PyPI release: push a `py/vX.Y.Z` tag. The committed pyproject version
# stays 0.0.0; the publish version is stamped from the tag.
#
# Auth: PyPI trusted publishing (OIDC) — no PYPI_TOKEN secret. Configure
# once on pypi.org → project schemapb → Publishing → Add trusted publisher:
# repo gopherex/schemapb, workflow release-py.yml. The action picks up the
# OIDC token automatically when no password is given.
name: Release Python

on:
  push:
    tags: ["py/v*"]

permissions:
  contents: read
  id-token: write # OIDC exchange with PyPI

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.9.28"
          working-directory: py
      - run: cd py && uv sync --frozen
      - run: cd py && uv run ruff check src tests && uv run mypy && uv run pytest -q
      - name: Stamp version from tag
        run: cd py && uv version "${GITHUB_REF_NAME#py/v}"
      - run: cd py && uv build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist
