# PyPI release: push a `py/vX.Y.Z` tag. The committed pyproject version stays
# 0.0.0; the publish version is stamped from the tag. Token: PYPI_TOKEN repo
# secret (PyPI API token scoped to the schemapb project).
name: Release Python

on:
  push:
    tags: ["py/v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.9.28"
          working-directory: py
      - run: cd py && uv sync --frozen
      - run: cd py && uv run ruff check src tests && uv run mypy && uv run pytest -q
      - name: Stamp version from tag
        run: cd py && uv version "${GITHUB_REF_NAME#py/v}"
      - run: cd py && uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist
          password: ${{ secrets.PYPI_TOKEN }}
