name: Publish npm package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0, no leading v)"
        required: true

permissions:
  contents: write # create the GitHub release
  packages: write # publish to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@stroppy-io"

      - name: Resolve version
        # Untrusted inputs are read via env (never inlined into the script).
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          # Bump every workspace package to the same version.
          npm version "$VERSION" --no-git-tag-version --workspaces

      - run: npm install

      # Build all packages (schemapb: make wasm + tsup; schemapb-react: tsup).
      - run: npm run build --workspaces --if-present

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish -w @stroppy-io/schemapb
          npm publish -w @stroppy-io/schemapb-react

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
