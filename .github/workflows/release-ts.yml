# npm release: push a `ts/vX.Y.Z` tag. The committed package.json version
# stays 0.0.0; the publish version is stamped from the tag (single source of
# truth, no bump commits).
#
# Auth: npm trusted publishing (OIDC) — no NPM_TOKEN secret. Configure once
# on npmjs.com → package @gopherex/schemapb → Settings → Trusted publisher:
# repo gopherex/schemapb, workflow release-ts.yml. NODE_AUTH_TOKEN must NOT
# be set, or npm falls back to the legacy token path. Provenance is
# generated automatically under trusted publishing.
name: Release TypeScript

on:
  push:
    tags: ["ts/v*"]

permissions:
  contents: read
  id-token: write # OIDC exchange with npm

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # bundles npm >= 11.5.1, required for OIDC publish
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: cd ts && yarn install --immutable
      - run: cd ts && yarn lint && yarn typecheck && yarn test
      - run: cd ts && yarn build
      - name: Stamp version from tag
        run: cd ts && npm version --no-git-tag-version "${GITHUB_REF_NAME#ts/v}"
      - name: Publish to npm (trusted publishing)
        run: cd ts && npm publish --access public
