# crates.io release: push a `rust/vX.Y.Z` tag. The committed Cargo.toml
# version stays 0.0.0; the publish version is stamped from the tag.
#
# Auth: crates.io trusted publishing (OIDC) — no CARGO_REGISTRY_TOKEN
# secret. Configure once on crates.io → crate schemapb → Settings → Trusted
# Publishing: repo gopherex/schemapb, workflow release-rust.yml. The
# official auth action mints a short-lived token and revokes it after the
# job.
name: Release Rust

on:
  push:
    tags: ["rust/v*"]

permissions:
  contents: read
  id-token: write # OIDC exchange with crates.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cd rust && cargo clippy --all-targets -- -D warnings && cargo fmt --check
      - run: cd rust && cargo test --quiet
      - name: Stamp version from tag
        run: |
          cd rust
          v="${GITHUB_REF_NAME#rust/v}"
          sed -i "0,/^version = \"0.0.0\"/s//version = \"$v\"/" Cargo.toml
          grep -q "^version = \"$v\"" Cargo.toml
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cd rust && cargo publish --allow-dirty
