name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # sanity: the wasm entrypoint still compiles for js/wasm
      - run: GOOS=js GOARCH=wasm go build -o /dev/null ./wasm

  schemapbgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/schemapbgen/go.mod
          cache-dependency-path: cmd/schemapbgen/go.sum
      # No workspace here: the CLI builds against its pinned schemapb version
      # from the module proxy, exactly as `go install` would for a consumer.
      - name: gofmt
        working-directory: cmd/schemapbgen
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::gofmt needed:"; echo "$out"; exit 1; fi
      - working-directory: cmd/schemapbgen
        run: go vet ./...
      - working-directory: cmd/schemapbgen
        run: go build ./...
      - working-directory: cmd/schemapbgen
        run: go test ./...

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6 # needed: each package's pretest builds the wasm
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci # installs all workspaces
      # Each package's pretest builds the wasm it needs, then vitest runs.
      - run: npm test --workspaces --if-present
