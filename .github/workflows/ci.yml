# Go and TypeScript are the supported CI/release targets.
# Generated code is committed, so no codegen here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  EASYP_VERSION: v0.16.6
  GOLANGCI_LINT_VERSION: v2.6.2

jobs:
  proto:
    name: proto lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install easyp
        run: GOBIN="$PWD/bin" go install "github.com/easyp-tech/easyp/cmd/easyp@${EASYP_VERSION}"
      - run: ./bin/easyp --cfg schemapb/easyp.go.yaml lint --root "$PWD" -p schemapb

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$PWD/bin" "$GOLANGCI_LINT_VERSION"
      - run: cd go && go build ./...
      - run: cd go && ../bin/golangci-lint run ./...
      - run: cd go && go test ./...

  ts:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Yarn 4 is pinned via packageManager + .yarn in the repo.
      - run: corepack enable
      - run: cd ts && yarn install --immutable
      - run: cd ts && yarn lint
      - run: cd ts && yarn typecheck
      - run: cd ts && yarn test
      - run: cd ts && yarn build
