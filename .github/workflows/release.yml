name: Release binaries

# On a vX.Y.Z tag, cross-compile the schemapbgen CLI and attach the archives to
# the GitHub release. publish-npm.yml creates the release (npm + notes) on the
# same tag; this workflow waits for it and uploads binaries, creating the
# release itself only as a fallback. Uploads use --clobber so re-runs are safe.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/schemapbgen/go.mod
          cache-dependency-path: cmd/schemapbgen/go.sum

      - name: Build archive
        working-directory: cmd/schemapbgen
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          bin="schemapbgen"
          [ "$GOOS" = "windows" ] && bin="schemapbgen.exe"
          go build -trimpath -ldflags "-s -w" -o "$bin" .
          base="schemapbgen_${TAG}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            zip "${base}.zip" "$bin"
            echo "ASSET=cmd/schemapbgen/${base}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${base}.tar.gz" "$bin"
            echo "ASSET=cmd/schemapbgen/${base}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: schemapbgen_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Wait for publish-npm.yml to create the release, then upload.
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "waiting for release $TAG to exist ($i/60)…"
            sleep 5
          done
          # Fallback: create it ourselves if it never appeared.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
