# Go uses the companion go/vX.Y.Z tag. TypeScript is published to GitHub Packages.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify version and Go companion tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[01]\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "go/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gopherex'
      - run: corepack enable
      - run: cd ts && yarn install --immutable && yarn build
      - name: Stamp and pack TypeScript package
        working-directory: ts
        run: |
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
          mkdir -p ../release-artifacts
          npm pack --pack-destination ../release-artifacts
          cd ../release-artifacts
          sha256sum ./*.tgz > SHA256SUMS
      - name: Publish TypeScript to GitHub Packages
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag \
            --title "$RELEASE_TAG" --generate-notes
