# Release: ONE `vX.Y.Z` tag releases all four languages in lockstep.
# Tags are cut with `make release` (clean-tree checks, bump menu), which
# pushes the pair vX.Y.Z + go/vX.Y.Z — the go/ prefix is required by the Go
# module proxy for a module in the go/ subdirectory and triggers nothing
# here ("v*" does not match "go/v*").
#
# Committed manifests stay 0.0.0; each publish job stamps the version from
# the tag. Every job re-runs its language's full lint+test gate — a red
# gate blocks only that language's publish.
#
# Auth: trusted publishing (OIDC) everywhere — no stored registry tokens.
# One-time setup per registry (all pointing at repo gopherex/schemapb,
# workflow release.yml): see docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: cd go && go build ./... && go test ./...
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: >
            Go `go get github.com/gopherex/schemapb/go@${{ github.ref_name }}` ·
            npm `@gopherex/schemapb` · PyPI `schemapb` · crates.io `schemapb`

  ts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC exchange with npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # bundles npm >= 11.5.1, required for OIDC publish
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: cd ts && yarn install --immutable
      - run: cd ts && yarn lint && yarn typecheck && yarn test
      - run: cd ts && yarn build
      - name: Stamp version from tag
        run: cd ts && npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      # NODE_AUTH_TOKEN must NOT be set, or npm falls back to the legacy
      # token path. Provenance is automatic under trusted publishing.
      - name: Publish to npm (trusted publishing)
        run: cd ts && npm publish --access public

  py:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC exchange with PyPI
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.9.28"
          working-directory: py
      - run: cd py && uv sync --frozen
      - run: cd py && uv run ruff check src tests && uv run mypy && uv run pytest -q
      - name: Stamp version from tag
        run: cd py && uv version "${GITHUB_REF_NAME#v}"
      - run: cd py && uv build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC exchange with crates.io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cd rust && cargo clippy --all-targets -- -D warnings && cargo fmt --check
      - run: cd rust && cargo test --quiet
      - name: Stamp version from tag
        run: |
          cd rust
          v="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = \"0.0.0\"/s//version = \"$v\"/" Cargo.toml
          grep -q "^version = \"$v\"" Cargo.toml
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cd rust && cargo publish --allow-dirty
