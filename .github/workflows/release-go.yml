# Go release: push a `go/vX.Y.Z` tag (the tag prefix is required by the Go
# module proxy for a module living in the go/ subdirectory). Nothing is
# uploaded anywhere — the proxy pulls from the tag — so this workflow only
# gates the tag with tests and publishes a GitHub release for visibility.
# Auth: built-in GITHUB_TOKEN only.
name: Release Go

on:
  push:
    tags: ["go/v*"]

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: cd go && go build ./... && go test ./...
      - name: Module version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#go/}" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: >
            Go module: `go get github.com/gopherex/schemapb/go@${{ steps.ver.outputs.version }}`
