syntax = "proto3";

package schemapb;

import "google/protobuf/struct.proto";
import "schemapb/schema.proto";

option go_package = "github.com/stroppy-io/schemapb/schemapb";

/*
 * SchemaService validates form values against a Schema and evaluates a Schema's
 * derived (Computed) fields. It is generic: the logic is driven entirely by the
 * Schema (structured rules + expr-lang expressions), so no per-schema server
 * code is required. A schema may be supplied inline in the request or addressed
 * by its identity from the server-side registry.
 */
service SchemaService {
    /* Register (and validate) a schema, returning its identity. */
    rpc RegisterSchema(Schema) returns (RegisterSchemaResponse);
    /* Fetch a registered schema by identity (e.g. for a frontend to render). */
    rpc GetSchema(SchemaIdentity) returns (Schema);
    /* List registered schemas, optionally filtered. */
    rpc ListSchemas(Filter) returns (ListSchemasResponse);
    /* Check that a schema descriptor itself is well-formed. */
    rpc ValidateSchema(Schema) returns (ValidateSchemaResponse);
    /* Validate the values of a Filled form against its schema. */
    rpc Validate(Filled) returns (ValidateResponse);
    /* Evaluate the Computed fields of a Filled form. */
    rpc Compute(Filled) returns (ComputeResponse);
    /* Seal a Filled form into an immutable Baked (validate + resolve). */
    rpc Bake(Filled) returns (BakeResponse);
    /* Layer overrides onto a Baked and re-seal. */
    rpc Merge(MergeRequest) returns (BakeResponse);
}

/*
 * Filter narrows ListSchemas. Unset fields are not constrained; all set fields
 * must match (AND). An empty Filter lists everything.
 */
message Filter {
    /* Exact namespace match. */
    optional string namespace = 1;
    /* Exact name match. */
    optional string name = 2;
    /* Exact version match. */
    optional string version = 3;
    /* Case-insensitive substring match against the name. */
    optional string name_contains = 4;
}

/* SchemaSummary is the lightweight listing entry; fetch the full Schema with GetSchema. */
message SchemaSummary {
    /* Schema identity. */
    SchemaIdentity id = 1;
    /* Schema description, if any. */
    optional string description = 2;
}

message RegisterSchemaResponse {
    /* Identity the schema is stored under (its own id). */
    SchemaIdentity id = 1;
    /* True if the schema is well-formed and was stored. */
    bool valid = 2;
    /* Descriptor problems; non-empty means the schema was rejected. */
    repeated FieldError errors = 3;
}

message ListSchemasResponse {
    /* Matching schemas (summaries). */
    repeated SchemaSummary schemas = 1;
}

message ValidateSchemaResponse {
    /* True if the descriptor is well-formed. */
    bool valid = 1;
    /* Descriptor problems. */
    repeated FieldError errors = 2;
}

message ValidateResponse {
    /* True if there are no ERROR-severity failures. */
    bool valid = 1;
    /* Validation failures (errors and warnings). */
    repeated FieldError errors = 2;
}

/* How list (repeated) values merge in Merge. */
enum ListMerge {
    /* Concatenate base + override lists (proto.Merge default). */
    LIST_MERGE_APPEND = 0;
    /* Override list replaces the base list wholesale. */
    LIST_MERGE_REPLACE = 1;
}

message MergeRequest {
    /* The sealed base to layer onto (carries its own schema). */
    Baked base = 1;
    /* Partial values to merge over base.values. */
    google.protobuf.Struct overrides = 2;
    /* How list values combine. */
    ListMerge lists = 3;
}

/* BakeResponse is the result of Bake or Merge: a sealed Baked, or the errors
 * that prevented sealing. */
message BakeResponse {
    /* Set only if validation passed. */
    Baked baked = 1;
    /* Non-empty means the values were rejected; baked is unset. */
    repeated FieldError errors = 2;
}

message ComputeResponse {
    /*
     * The fully resolved form: the provided inputs, plus values filled from the
     * schema's defaults, plus the evaluated Computed (derived) fields.
     */
    google.protobuf.Struct values = 1;
    /* Errors raised while evaluating expressions. */
    repeated FieldError errors = 2;
}
