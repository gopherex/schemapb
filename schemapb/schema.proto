syntax = "proto3";

package cloud.v1.common;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/stroppy-io/schemapb/schemapb";

/*
 * Schema is a runtime, dynamic form descriptor. The server builds a Schema and
 * ships it to the frontend, which renders a form from it.
 *
 * Validation has two layers:
 *   - per-kind structured rules (gt/gte/lt/lte/in/pattern/...) for the common,
 *     single-field cases. Ergonomic to author and introspectable by the
 *     renderer (e.g. slider bounds, step).
 *   - Filed.rules: CEL expressions, for cross-field / conditional validation.
 *
 * Both layers run through one engine: structured rules are lowered to CEL at
 * load time, then evaluated by cel-go (server, authoritative) and cel-es
 * (client, live UX) from the same expression. Rendering is driven by Filed.UI.
 *
 * The PGV (validate.rules) options below validate the descriptor ITSELF (that a
 * Schema is well-formed: names set, expressions non-empty, a kind chosen), not
 * the runtime form values it describes.
 */
message Schema {
    message Filed {
        /*
         * Float field kind and its single-field constraints.
         * gt = exclusive min (> 0), gte = inclusive min (>= 1).
         * lt = exclusive max, lte = inclusive max.
         */
        message Float {
            /* Default value used when the field is unset. */
            optional float default = 1;
            /* Value must equal exactly this. */
            optional float const = 2;
            /* Exclusive minimum: value > gt. */
            optional float gt = 3;
            /* Inclusive minimum: value >= gte. */
            optional float gte = 4;
            /* Exclusive maximum: value < lt. */
            optional float lt = 5;
            /* Inclusive maximum: value <= lte. */
            optional float lte = 6;
            /* Value must be one of these. */
            repeated float in = 7;
            /* Value must not be any of these. */
            repeated float not_in = 8;
            /* Divisibility: quotient value/multiple_of must be whole. */
            optional float multiple_of = 9;
        }
        /*
         * Double field kind and its single-field constraints.
         */
        message Double {
            /* Default value used when the field is unset. */
            optional double default = 1;
            /* Value must equal exactly this. */
            optional double const = 2;
            /* Exclusive minimum: value > gt. */
            optional double gt = 3;
            /* Inclusive minimum: value >= gte. */
            optional double gte = 4;
            /* Exclusive maximum: value < lt. */
            optional double lt = 5;
            /* Inclusive maximum: value <= lte. */
            optional double lte = 6;
            /* Value must be one of these. */
            repeated double in = 7;
            /* Value must not be any of these. */
            repeated double not_in = 8;
            /* Divisibility: quotient value/multiple_of must be whole. */
            optional double multiple_of = 9;
        }
        /*
         * Int32 field kind and its single-field constraints.
         */
        message Int32 {
            /* Default value used when the field is unset. */
            optional int32 default = 1;
            /* Value must equal exactly this. */
            optional int32 const = 2;
            /* Exclusive minimum: value > gt. */
            optional int32 gt = 3;
            /* Inclusive minimum: value >= gte. */
            optional int32 gte = 4;
            /* Exclusive maximum: value < lt. */
            optional int32 lt = 5;
            /* Inclusive maximum: value <= lte. */
            optional int32 lte = 6;
            /* Value must be one of these. */
            repeated int32 in = 7;
            /* Value must not be any of these. */
            repeated int32 not_in = 8;
            /* Divisibility: value % multiple_of must be 0. */
            optional int32 multiple_of = 9;
        }
        /*
         * Int64 field kind and its single-field constraints.
         */
        message Int64 {
            /* Default value used when the field is unset. */
            optional int64 default = 1;
            /* Value must equal exactly this. */
            optional int64 const = 2;
            /* Exclusive minimum: value > gt. */
            optional int64 gt = 3;
            /* Inclusive minimum: value >= gte. */
            optional int64 gte = 4;
            /* Exclusive maximum: value < lt. */
            optional int64 lt = 5;
            /* Inclusive maximum: value <= lte. */
            optional int64 lte = 6;
            /* Value must be one of these. */
            repeated int64 in = 7;
            /* Value must not be any of these. */
            repeated int64 not_in = 8;
            /* Divisibility: value % multiple_of must be 0. */
            optional int64 multiple_of = 9;
        }
        /*
         * UInt32 field kind and its single-field constraints.
         */
        message UInt32 {
            /* Default value used when the field is unset. */
            optional uint32 default = 1;
            /* Value must equal exactly this. */
            optional uint32 const = 2;
            /* Exclusive minimum: value > gt. */
            optional uint32 gt = 3;
            /* Inclusive minimum: value >= gte. */
            optional uint32 gte = 4;
            /* Exclusive maximum: value < lt. */
            optional uint32 lt = 5;
            /* Inclusive maximum: value <= lte. */
            optional uint32 lte = 6;
            /* Value must be one of these. */
            repeated uint32 in = 7;
            /* Value must not be any of these. */
            repeated uint32 not_in = 8;
            /* Divisibility: value % multiple_of must be 0. */
            optional uint32 multiple_of = 9;
        }
        /*
         * UInt64 field kind and its single-field constraints.
         */
        message UInt64 {
            /* Default value used when the field is unset. */
            optional uint64 default = 1;
            /* Value must equal exactly this. */
            optional uint64 const = 2;
            /* Exclusive minimum: value > gt. */
            optional uint64 gt = 3;
            /* Inclusive minimum: value >= gte. */
            optional uint64 gte = 4;
            /* Exclusive maximum: value < lt. */
            optional uint64 lt = 5;
            /* Inclusive maximum: value <= lte. */
            optional uint64 lte = 6;
            /* Value must be one of these. */
            repeated uint64 in = 7;
            /* Value must not be any of these. */
            repeated uint64 not_in = 8;
            /* Divisibility: value % multiple_of must be 0. */
            optional uint64 multiple_of = 9;
        }
        /*
         * Bool field kind.
         */
        message Bool {
            /* Default value used when the field is unset. */
            optional bool default = 1;
            /* Value must equal exactly this. */
            optional bool const = 2;
        }
        /*
         * String field kind and its single-field constraints.
         */
        message String {
            /* Default value used when the field is unset. */
            optional string default = 1;
            /* Value must equal exactly this. */
            optional string const = 2;
            /* Exact character length required. */
            optional uint64 len = 3;
            /* Minimum character length. */
            optional uint64 min_len = 4;
            /* Maximum character length. */
            optional uint64 max_len = 5;
            /* RE2 regular expression the value must match. */
            optional string pattern = 6;
            /* Value must be one of these. */
            repeated string in = 7;
            /* Value must not be any of these. */
            repeated string not_in = 8;
        }
        /*
         * Enum field kind: an integer value with human labels.
         */
        message Enum {
            /* Default value used when the field is unset. */
            optional int32 default = 1;
            /* Allowed enum values: integer -> human label. */
            map<int32, string> values = 2;
            /* If true, value must be one of the keys in values. */
            bool defined_only = 3;
            /* Value must be one of these. */
            repeated int32 in = 4;
            /* Value must not be any of these. */
            repeated int32 not_in = 5;
        }
        /*
         * Duration field kind with optional range bounds.
         */
        message Duration {
            /* Default value used when the field is unset. */
            optional google.protobuf.Duration default = 1;
            /* Exclusive minimum: value > gt. */
            optional google.protobuf.Duration gt = 2;
            /* Inclusive minimum: value >= gte. */
            optional google.protobuf.Duration gte = 3;
            /* Exclusive maximum: value < lt. */
            optional google.protobuf.Duration lt = 4;
            /* Inclusive maximum: value <= lte. */
            optional google.protobuf.Duration lte = 5;
        }
        /*
         * Timestamp field kind with optional range bounds.
         */
        message Timestamp {
            /* Default value used when the field is unset. */
            optional google.protobuf.Timestamp default = 1;
            /* Exclusive minimum: value > gt. */
            optional google.protobuf.Timestamp gt = 2;
            /* Inclusive minimum: value >= gte. */
            optional google.protobuf.Timestamp gte = 3;
            /* Exclusive maximum: value < lt. */
            optional google.protobuf.Timestamp lt = 4;
            /* Inclusive maximum: value <= lte. */
            optional google.protobuf.Timestamp lte = 5;
        }
        /*
         * List field kind: a repeated value described by its element field(s).
         */
        message List {
            /* Element field definition(s) describing list items. */
            repeated Filed items = 1;
            /* Minimum number of items. */
            optional uint64 min_items = 2;
            /* Maximum number of items. */
            optional uint64 max_items = 3;
            /* If true, items must be unique. */
            bool unique = 4;
        }
        /*
         * Object field kind: a nested sub-form described by its own Schema.
         */
        message Object {
            /* Nested object schema. */
            optional Schema schema = 1;
        }

        /*
         * UI carries render hints: how to draw the field. Numeric bounds and step
         * are introspected from the per-kind structured rules (gte/lte/multiple_of).
         */
        message UI {
            /* Widget kinds the renderer can pick from. */
            enum Widget {
                /* Unset: renderer picks a default widget by field kind. */
                WIDGET_UNSPECIFIED = 0;
                /* Single-line text or number input, per kind. */
                WIDGET_INPUT = 1;
                /* Slider for bounded numbers. */
                WIDGET_SLIDER = 2;
                /* Dropdown select, for enum. */
                WIDGET_SELECT = 3;
                /* Radio group. */
                WIDGET_RADIO = 4;
                /* Toggle switch, for bool. */
                WIDGET_SWITCH = 5;
                /* Multi-line text area. */
                WIDGET_TEXTAREA = 6;
            }
            /* Human label; falls back to Filed.name. */
            optional string label = 1;
            /* Help text; falls back to Filed.description. */
            optional string help = 2;
            /* Placeholder text for empty inputs. */
            optional string placeholder = 3;
            /* Explicit widget; if unset the renderer defaults by field kind. */
            optional Widget widget = 4;
            /* Display suffix; the value is stored in this unit. */
            optional string unit = 5;
            /* Input increment; if unset it is derived from multiple_of. */
            optional double step = 6;
            /* Section key used to group fields in the form. */
            optional string group = 7;
            /* Sort order of the field within the form. */
            optional int32 order = 8;
            /* If true, hide the field behind an "advanced" toggle. */
            optional bool advanced = 9;
            /* CEL bool; the field is rendered only when this is true. */
            optional string visible_if = 10;
            /* CEL bool; the field is enabled only when this is true. */
            optional string enabled_if = 11;
        }

        /*
         * Severity of a failed rule.
         */
        enum Severity {
            /* Unset: treated as ERROR. */
            SEVERITY_UNSPECIFIED = 0;
            /* Blocks submit. */
            ERROR = 1;
            /* Surfaced to the user but does not block submit. */
            WARNING = 2;
        }

        /*
         * Rule is a CEL validation expression for cross-field / conditional checks.
         * Context: `this` = this field's value (field-level rules only);
         *          `root` = whole form as map<string, dyn>, any field reachable.
         * expr must evaluate to bool; true means VALID.
         */
        message Rule {
            /* CEL boolean expression; true means the value is valid. */
            string expr = 1;
            /* Message shown to the user when expr is false. */
            string message = 2;
            /* Stable rule id, for mapping errors back to rules. */
            optional string id = 3;
            /* Severity; defaults to ERROR. */
            optional Severity severity = 4;
        }

        /* Field name; the key under which the value lives in the form. */
        string name = 1;
        /* Human description of the field. */
        optional string description = 2;
        /* If true, the value may be null/empty. */
        bool nullable = 3;
        /* If true, the value must be present. */
        bool required = 4;
        /* Render hints for this field. */
        UI ui = 5;
        /* Cross-field CEL validation rules (`this` is bound to this field). */
        repeated Rule rules = 6;
        /* The field kind; exactly one must be set. */
        oneof kind {
            /* Float field. */
            Float float = 100;
            /* Double field. */
            Double double = 101;
            /* Int32 field. */
            Int32 int32 = 102;
            /* Int64 field. */
            Int64 int64 = 103;
            /* UInt32 field. */
            UInt32 uint32 = 104;
            /* UInt64 field. */
            UInt64 uint64 = 105;
            /* Bool field. */
            Bool bool = 106;
            /* String field. */
            String string = 107;
            /* Enum field. */
            Enum enum = 108;
            /* Duration field. */
            Duration duration = 109;
            /* Timestamp field. */
            Timestamp timestamp = 110;
            /* List field. */
            List list = 111;
            /* Nested object field. */
            Object object = 112;
        }
    }
    /* Optional schema name. */
    optional string name = 1;
    /* The fields that make up the form. */
    repeated Filed fields = 2;
    /* Form-wide invariant rules (`root` only, no `this`). */
    repeated Filed.Rule rules = 3;
}

/*
 * FieldError is a single validation failure returned by the server-side
 * validator (and reusable to render server errors on the client).
 */
message FieldError {
    /* Field name or dotted path that failed. */
    string field = 1;
    /* Human-readable failure message. */
    string message = 2;
    /* Id of the rule that failed, if any. */
    optional string rule_id = 3;
    /* Severity of the failure. */
    Schema.Filed.Severity severity = 4;
}
