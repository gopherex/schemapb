lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: NONE
  service_suffix: API
  ignore: []
  except: []
  allow_comment_ignores: false
  ignore_only: {}
deps:
generate:
  inputs:
    - directory: schemapb
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    - name: es
      out: ts
      opts:
        target: ts
        import_extension: ts
        json_types: true
        valid_types: legacy_required+protovalidate_required
breaking:
  ignore: []
  against_git_ref: master-worker
