[package]
name = "schemapb"
version = "0.0.0"
edition = "2021"
description = "schemapb — proto-defined form/config schema descriptor: native Rust implementation (validation, CEL computed values, Mustache rendering)"
license = "MIT"
repository = "https://github.com/gopherex/schemapb"
readme = "README.md"

[dependencies]
prost = "0.14"
pbjson = "0.8"
pbjson-types = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cel-interpreter = { version = "0.10", features = ["chrono"] }
cel-parser = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mustache = "0.9"
semver = "1"
regex = "1"
base64 = "0.22"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# The engine's kind dispatch is flat and exhaustive by nature (mirrors the
# golangci/biome/ruff suppressions in the sibling implementations).
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Spec message templates carry literal {expected}/{actual} placeholders.
literal_string_with_formatting_args = "allow"
# Helper fns/uses live next to their single call site, as in the other ports.
items_after_statements = "allow"
# The message-template and CEL dispatch tables intentionally list every code
# separately for spec readability, even when texts coincide.
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
# Public API takes the concrete HashMap the generated prost types use.
implicit_hasher = "allow"
# RenderField mirrors the cross-language render-context contract 1:1.
struct_excessive_bools = "allow"
